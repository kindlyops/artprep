repos:
  - repo: local
    hooks:
      - id: swift-check
        name: Swift format and behavior tests
        entry: bash scripts/check-swift.sh
        language: system
        pass_filenames: false
        types: [swift]
      - id: python-check
        name: Python renderer checks
        entry: bash scripts/check-python.sh
        language: system
        pass_filenames: false
        types: [python]
      - id: shell-check
        name: Shell validation
        entry: bash -c 'shellcheck scripts/*.sh && shfmt -d scripts/*.sh'
        language: system
        pass_filenames: false
        types: [shell]
      - id: actions-check
        name: GitHub Actions validation
        entry: bash -c 'actionlint && zizmor --offline .github/workflows'
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
