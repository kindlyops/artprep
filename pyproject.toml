[tool.pytest.ini_options]
pythonpath = ["renderer"]
testpaths = ["PythonTests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["renderer/job.py"]
