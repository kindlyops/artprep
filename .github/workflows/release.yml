name: Request macOS release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: >-
      github.repository == 'kindlyops/artprep' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: build-trigger
    timeout-minutes: 5
    steps:
      - name: Create a token for the private build repository
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KINDLYOPS_BUILD_APP_CLIENT_ID }}
          private-key: ${{ secrets.KINDLYOPS_BUILD_APP_PRIVATE_KEY }}
          owner: kindlyops
          repositories: artprep-build
          permission-actions: write

      - name: Request a build of this merged commit
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo kindlyops/artprep-build --ref main \
            -f "source_sha=$SOURCE_SHA"
          echo 'Build requested: https://github.com/kindlyops/artprep-build/actions' \
            >> "$GITHUB_STEP_SUMMARY"
